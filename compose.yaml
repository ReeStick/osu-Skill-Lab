name: osu-skill-lab

x-app: &app
  image: osu-skill-lab:local
  build: .
  environment:
    OSU_LAB_ENVIRONMENT: ${OSU_LAB_ENVIRONMENT:-local}
    # Host DSN from .env is intentionally replaced by the Compose service hostname.
    OSU_LAB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-osu_lab}:${POSTGRES_PASSWORD:-osu_lab_local}@db:5432/${POSTGRES_DB:-osu_skill_lab}
    OSU_LAB_DATABASE_TIMEOUT_SECONDS: ${OSU_LAB_DATABASE_TIMEOUT_SECONDS:-3}
    OSU_LAB_OSU_CLIENT_ID: ${OSU_LAB_OSU_CLIENT_ID:-}
    OSU_LAB_OSU_CLIENT_SECRET: ${OSU_LAB_OSU_CLIENT_SECRET:-}
    OSU_LAB_OSU_TIMEOUT_SECONDS: ${OSU_LAB_OSU_TIMEOUT_SECONDS:-10}
    OSU_LAB_OSU_CACHE_TTL_SECONDS: ${OSU_LAB_OSU_CACHE_TTL_SECONDS:-3600}
    OSU_LAB_MIRROR_TIMEOUT_SECONDS: ${OSU_LAB_MIRROR_TIMEOUT_SECONDS:-20}
    OSU_LAB_MIRROR_CACHE_TTL_SECONDS: ${OSU_LAB_MIRROR_CACHE_TTL_SECONDS:-600}
    OSU_LAB_RABBITMQ_URL: amqp://${RABBITMQ_USER:-osu_lab}:${RABBITMQ_PASSWORD:-osu_lab_local}@rabbitmq:5672/
    OSU_LAB_WORKER_CONCURRENCY: ${OSU_LAB_WORKER_CONCURRENCY:-1}
    OSU_LAB_MODEL_ARTIFACT_DIRECTORY: /var/lib/osu-skill-lab/models

services:
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-osu_lab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-osu_lab_local}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osu_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osu_lab_local}
      POSTGRES_DB: ${POSTGRES_DB:-osu_skill_lab}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    volumes:
      - model_artifacts:/var/lib/osu-skill-lab/models
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 5s

  dispatcher:
    <<: *app
    command: ["python", "-m", "osu_skill_lab.workers", "dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "osu_skill_lab.workers", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  rabbitmq_data:
  model_artifacts:
